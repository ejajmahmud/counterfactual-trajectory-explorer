[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "counterfactual-trajectory-explorer"
version = "0.1.0"
description = "Branching state simulator that forks agent state at critical decision junctures to evaluate alternate tool invocation strategies"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
counterfactual-trajectory-explorer = "counterfactual_trajectory_explorer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["counterfactual_trajectory_explorer*"]
